
<div class="appHeader text-light">
    <div class="pageTitle">
      {{ 'helloword' | translate}}
    </div>
   
</div>
    
<div id="appCapsule">     
  <div class="section full pt-2">
        <div class="section-title justify-content-center">
            <div *ngIf="status=='success'" class="text-center">
              <i class="material-icons" style="font-size: 20px; color: #fff;font-size: 70px; border-radius: 50px; background-color: green;">check_circle</i>         
                <h2 class="text-success">{{ 'bet_success' | translate}}</h2>
            </div>
            <div *ngIf="status !='success'" class="text-center">
              <i class="material-icons" style="font-size: 20px; color: #fff;font-size: 70px; border-radius: 50px; background-color: red;">cancel</i>         
               
                <h3 class="text-danger">{{ 'bet_unsuccess' | translate}}</h3>
            </div>         
        </div>
  </div>
  <div class="section full mt-5">
    <div class="section-title justify-content-center">
    <button type="button" class="button" (click)="openHomePage()"
    style="width: 90%;align-content: center;background-color: #2456A6;border-radius: 5px;color: #fff; padding: 11px 0px;">
       {{ 'bet_done' | translate }}
    </button>
    </div>
   </div>
  

</div>

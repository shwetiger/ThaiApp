<app-not-refresh-appbar >{{ 'helloword' | translate }}</app-not-refresh-appbar>
<div id="appCapsule" *ngIf="common.refreshLoading==false">
    <div class="pt-3">
        <div class="text-center">
            <img src="assets/img/email.png" alt="pendingimage" width="50px" height="50px">
       
    </div> 

        <form [formGroup]="inviteCodeForm"  novalidate>
            <div class="row mt-1">
                <div class="col justify-content-center text-center">
                <h4 class="service-color" *ngIf="userProfileModel.email==null || userProfileModel.email==''">{{ 'email_address_desc' | translate}} </h4>
                <div class="col justify-content-center text-center" *ngIf="userProfileModel.email!=null && userProfileModel.email!=''">
                    <input type="text" formControlName="refCode" [(ngModel)]="userProfileModel.email" disabled
                    class="form-control refCode" placeholder="{{ 'enterRef' | translate}}" >
                </div>
                <div class="col justify-content-center text-center mt-2" *ngIf="userProfileModel.email==null || userProfileModel.email==''">
                    <input type="text" formControlName="refCode" [(ngModel)]="emailModel.email_address" 
                    class="form-control refCode" placeholder="{{ 'email_address' | translate}}" >
                </div>
                </div>  
            </div>
           
            <div 
            class="pt-2 mt-2 saveBtn" 
            style="display: flex; justify-content: center;" 
            *ngIf="userProfileModel.email==null || userProfileModel.email==''"
          >
            <!-- Parent container to position the button and spinner -->
            <div style="position: relative; width: 90%;">
              <!-- Submit Button -->
              <button 
                type="submit" 
                class="btn shadowed" 
                *ngIf="!common.submitLoading" 
                (click)="onSubmitting()" 
                style="width: 100%; align-content: center; background-color: #2456A6; border-radius: 5px; color: #fff;"
              >
                {{ 'next' | translate }}
              </button>
              <!-- Loading Spinner -->
              <div 
                *ngIf="common.submitLoading" 
                style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);"
              >
                <ngx-spinner 
                  [name]="common.loading.submitLoading.name" 
                  [size]="common.loading.submitLoading.size"
                  [color]="common.loading.submitLoading.color" 
                  [type]="common.loading.submitLoading.type"
                  [fullScreen]="false"
                >
                </ngx-spinner>
              </div>
            </div>
          </div>
          
            
        </form>
    </div>
</div>

<ngx-spinner [name]="common.loading.refreshLoading.name" [size]="common.loading.refreshLoading.size"
  [color]="common.loading.refreshLoading.color" [type]="common.loading.refreshLoading.type"
  [fullScreen]="common.loading.refreshLoading.fullScreen"></ngx-spinner>

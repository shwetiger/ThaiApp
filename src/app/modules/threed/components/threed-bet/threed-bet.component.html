<!-- <appbar (myEvent)="refreshPage()" >{{ 'helloword' | translate }}</appbar> -->
<div class="appHeader text-light">
    <div class="left">
        <a (click)="goBack()" class="headerButton">
            <img src="assets/img/icon/arrow_back.png" alt="">
        </a>
    </div>
    <div class="pageTitle"> {{ 'helloword' | translate }} </div>
    <div class="right">
        <a class="headerButton">
            <img src="assets/img/icon/refresh.png" alt="" (click)="refreshPage()">
        </a>
    </div>
</div>

<div id="appCapsule">
    <div class="container-fluid wrapper">
        <div class="row mx-1">
            <div class="container no-padding">
                <threed-close-time (myEvent)="refreshPage()" (closed)="twodClose($event)"></threed-close-time>
            </div>
        </div>
        <div class="row">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-auto px-2 pt-1">
                        <button type="button" class="btn dream-book-button" (click)="goToDreamBook()">
                            <img src="assets/img/icons/book.png" alt="" width="22">
                            <span class="ml-1">{{ 'dream_book' | translate }}</span>
                        </button>
                    </div>
                    <div class="col pt-1 bet-inpt-padding">
                        <input [type]="threedNumberFieldType" minlength="3" [(ngModel)]="amount"
                            (keyup.enter)="enter($event)" id="betAmt" [ngModelOptions]="{standalone: true}"
                            (keyup)="checkBetAmount()" (keypress)="keyPressNumbers($event)"
                            placeholder="{{'amountHint' | translate}}" class="form-control input">
                        <p id="betAmountErr" class="error-color"></p>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-auto px-2 pt-1">
                        <button type="button" class="btn hot-button" [routerLink]="['/threed/chancepage']"
                            [replaceUrl]="false">
                            <span style="white-space: nowrap;">{{ 'threed_chance_title' | translate}}</span>
                        </button>
                    </div>
                    <div class="col pt-1" style="padding-left: 10px;">
                        <input [type]="threedNumberFieldType" maxlength="3" (keyup.enter)="enter($event)"
                            [(ngModel)]="betValue" onfocus="this.value=''" id="betNumber"
                            [ngModelOptions]="{standalone: true}" (keyup)="checkBetNumberCount()"
                            (keypress)="keyPressNumberfornumberintput($event)"
                            placeholder="{{'threed_number_text' | translate}}" class="form-control input" pattern="\d*">
                        <div class="row">
                            <div class="col-9">
                                <p id="betNumberCountErr" class="error-color sj">
                                </p>
                            </div>
                            <div class="col-3">
                                <h5 class="pt-1 text-muted">{{ betValue.toString().length }}/3</h5>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-8">
                        <div class="date-selector">
                            <div class="year" id="year1"></div>
                            <div class="month" id="month1"></div>
                            <div class="day" id="day1"></div>
                            <input type="hidden" id="number-swiper-value" value="">
                        </div>
                        <div class="date-overlay"></div>
                    </div>
                    <div class="col-4">
                        <div class="row custom-button">
                            <button type="button" (click)="quickSelectedFunction()" class="threed-button mt-1">{{
                                'quick_select' | translate}}</button>
                            <button type="button" (click)="roundNumber(betValue)" class="threed-button">{{
                                'threed_round' | translate}}</button>
                            <button type="button" (click)="selectNumber(betValue)" class="threed-button">{{
                                'withdraw_select' | translate}}</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row mt-1 bet-number">
            <div class="container no-padding">
                <div class="row pt-2 d-flex justify-content-center">
                    <div *ngFor="let num1 of betNumberList" (click)="selectBetNumber(num1)"
                        class=" thread-betselectednumv2"
                        [ngStyle]="{'background-color':num1.isUse == 0 ? 'grey' : '#2253A2','color':'white' }">
                        {{ num1.betNumberValue}}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- refresh loading -->
<ngx-spinner [name]="common.loading.refreshLoading.name" [size]="common.loading.refreshLoading.size"
    [color]="common.loading.refreshLoading.color" [type]="common.loading.refreshLoading.type"
    [fullScreen]="common.loading.refreshLoading.fullScreen"></ngx-spinner>

<!-- App Bottom Menu -->
<div class="section  d-flex justify-content-around bg-white" id="navTwoDBet">
    <button type="button" class="btn button-notRound clear" (click)="clearNumber()"
        onclick="document.getElementById('betNumber').value = ''">{{ 'clean' | translate}}</button>
    <button type="button" style="font-size: 14px;" class="btn button-notRound submit" (click)="threeDBet()"
        onclick="document.getElementById('betAmt').focus()">{{ 'bet' | translate}}</button>
</div>

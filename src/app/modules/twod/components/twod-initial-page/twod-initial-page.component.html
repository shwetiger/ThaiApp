      <a (click)="goBack()" class="headerButton">

    </div>
    <div class="pageTitle"> {{ 'helloword' | translate }} </div>
    <div class="right">

        <img src="assets/img/icon/refresh.png" alt="" (click)="refreshPageHeader()">  
    
      </a>

<!-- * App Header -->
<div id="appCapsule">
    <div class="extraHeader1">
        <div class="container" >
            <div class="row">
                <div class="container" style="padding: 0px !important;margin: 0px !important;">
                    <twod-close-time  (myEvent)="refreshPage()" (weekendClosed)="getWeekendClosed($event)" (HolidayClosed)="getHolidayClosed($event)"></twod-close-time>            
                </div>               
            </div>
            <div class="row pt-1">
                <div class="container">
                    <div class="row mx-2 twod-card">
                        <div class="col-4">
                            <div class="row justify-content-center">
                                <img src="assets/img/bethistoryblue.png" alt="image" class="imaged init" (click)="betHistory()" >                                  
                            </div>     
                            <div class="row justify-content-center">   <p style="color: #2253A2;">{{ 'history' | translate }}</p></div>                                     
                        </div>
                        <div class="col-4 ">
                            <div class="row justify-content-center">
                                <img src="assets/img/winner/2d_icon.png" alt="image" class="imagedwinner init" (click)="TwoDWinner()" >
                               
                            </div>   
                            <div class="row justify-content-center"> <p style="color:#2253A2 ;">{{ 'winner' | translate }}</p>    </div>                                       
                        </div>                        
                        <div class="col-4">
                            <div class="row justify-content-center">
                            <img src="assets/img/resultblue.png" alt="image" class="imaged init"  (click)="goToHoliday()">
                            </div>
                            <div class="row justify-content-center"> <p style="color: #2253A2;">{{ 'holiday' | translate }}</p></div>
                        </div>
                    </div>
                </div>
               
            </div>
        </div>
    
    </div>
    <div class="extraFooter">
        <div class="container"  style="padding: 0px !important;margin: 0px !important;">
            <app-twod-live></app-twod-live>
        </div>
    </div>

 <div class="section full d-flex justify-content-center" id="navTwoDBet"  style="background-color: #fff;">

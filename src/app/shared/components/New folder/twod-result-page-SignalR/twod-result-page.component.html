
<div class="container-fluid " *ngFor="let item of groupArrays" style="margin: 0px !important; padding: 0px !important;">
    <div class="row d-flex mt-3 justify-content-center date-top-card">
        <div class="card date-card">
            <span style="text-align: center;">{{ changeDateFormat(item.date) }}</span>
        </div>
    </div>
    <div class="row mx-3  mt-3 result-card-border">
        <div class="container result-card" *ngFor="let result of item.resultList;let i=index;">
            <div class="row" [ngClass]="{'driver': (i &gt; 0) }"></div>    
            <div class="row pt-2 section-name">
                <span >{{result.section}}</span>
            </div>  
            <div class="row">
                <div class="col-4">                    
                    <div class="justify-content-center">
                        <h4 class="setval-title text-center">Set</h4>
                        <h3 class=" setval text-center">{{result.set}}</h3>
                    </div>                   
                </div>

                <div class="col-4">
                    <div class="justify-content-center">
                        <h4 class="setval-title text-center">Value</h4>
                        <h3 class=" setval text-center">{{result.value}}</h3>
                    </div>                    
                </div>

                <div class="col-4">
                    <div class="justify-content-center">
                        <h4 class="setval-title text-center">2D</h4>
                        <h3 class=" text-center" style="color: #ff9100 !important;">{{result.result}}</h3>
                    </div>                 
                </div>
            </div>   
                  
        </div>
    </div>
</div>

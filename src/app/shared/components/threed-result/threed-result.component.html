<div class="container " style="overflow-x: hidden ;" *ngIf="!loading">
    <div class="section full" *ngIf="showlivelink==true && showliveVideo!=null">
        <div class="wide-block">
            <div class="video-container" (click)="handleVideoClick($event)">
                <iframe [class.thumbnail]="" [src]="showliveVideo" frameborder="0" webkitallowfullscreen
                    mozallowfullscreen allowfullscreen></iframe>

                <div *ngIf="deviceId!=null || issafariView==true">
                    <img src="assets/img/vdplay2.png" alt="Click To Watch" (click)="openlive()" class="overlay-image">
                </div>
            </div>
            <!-- <div class="video-container">
                {{isVideoFinished}}
                <iframe *ngIf="!isVideoFinished" [src]="showliveVideo" frameborder="0" allowfullscreen>
                </iframe>

                <img id="defaultImage" *ngIf="isVideoFinished" src="assets/img/ThaisinLive.png"
                    alt="Live finished">

            </div> -->

            <!-- <div *ngIf="!isLive" class="live-logo">
                <img src="assets/img/ThaisinLive.png" width="100%" height="190px" alt="Logo">
            </div> -->

        </div>

    </div>
    <div class="root">
        <div id="gridcontainer">
            <div class="" *ngFor="let result of resultList">
                <div class="card result-card">
                    <div class="categories">
                        <div class="setval">
                            <label>{{'betDate' | translate}}</label>
                            <label>{{getDate(result.for_date_time_Str)}}</label>
                        </div>
                        <div class="setval">
                            <label>
                                3D
                            </label>
                            <label style="color: gold !important;">{{result.number}}</label>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>


</div>
<!-- <div *ngIf="loading" style="position: absolute; top: 80%; left: 50%; transform: translate(-50%, -50%); z-index: 1050;">
        <ngx-spinner size="small" color="rgb(6,56,107)" type="ball-spin-clockwise" [fullScreen]="false"></ngx-spinner>
    </div> -->

<div *ngIf="loading" style="
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 1050;
     ">
    <ngx-spinner size="small" color="rgb(6,56,107)" type="ball-spin-clockwise" [fullScreen]="false">
    </ngx-spinner>
</div>
